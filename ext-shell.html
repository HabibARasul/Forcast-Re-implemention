<meta charset="utf-8">
<title>Forecast-to-Cost Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workbench. Tabs across the top for the tool's areas; the model editor is a two-pane table list and line-numbered sheet. */
:root {
  --bg: #eef2f3; --surface: #ffffff; --sunk: #f6f8f9; --ink: #15212a; --muted: #56656f; --line: #d3dbe0;
  --accent: #0d6b66; --accent-ink: #ffffff; --joint: #b8700c; --c3: #6b4fa0; --c4: #2f6fae; --c5: #b23a48; --c6: #7d8a1f;
  --ok: #24744a; --ok-bg: #e2f2e8; --warn: #9a6512; --warn-bg: #fbefd9; --bad: #b3261e; --bad-bg: #fbe4e2;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif; --body: "Public Sans", "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --paper: "Tinos", "Times New Roman", Times, serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1418; --surface: #161f25; --sunk: #121a1f; --ink: #e2e9ed; --muted: #97a5ae; --line: #2a3740;
  --accent: #3fb3aa; --accent-ink: #062321; --joint: #e3a243; --c3: #ad91e3; --c4: #74a9e0; --c5: #e57f8b; --c6: #c3cf5c;
  --ok: #69c48f; --ok-bg: #13301f; --warn: #e2b05a; --warn-bg: #33270f; --bad: #f08a80; --bad-bg: #3a1714; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #161f25; --sunk: #121a1f; --ink: #e2e9ed; --muted: #97a5ae; --line: #2a3740;
  --accent: #3fb3aa; --accent-ink: #062321; --joint: #e3a243; --c3: #ad91e3; --c4: #74a9e0; --c5: #e57f8b; --c6: #c3cf5c;
  --ok: #69c48f; --ok-bg: #13301f; --warn: #e2b05a; --warn-bg: #33270f; --bad: #f08a80; --bad-bg: #3a1714; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); margin: 0 }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15 }
h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em }
h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.015em }
h3 { font-size: 1.02rem; font-weight: 700 }
p { margin: 0; max-width: 68ch }
a { color: var(--accent) }
button, input, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.mono, td.num, .num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.eyebrow { font: 600 0.72rem/1 var(--body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted) }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px }
header.top .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px }
header.top .brand small { color: var(--muted); font-size: 0.8rem }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: var(--r); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.primary:hover { filter: brightness(1.08) }
.btn:disabled { opacity: 0.5; cursor: progress }
.btn.ghost { border-color: transparent; background: transparent }
kbd { font: 500 0.72rem var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--sunk); color: var(--muted) }

.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 60px) }
nav.rail { border-right: 1px solid var(--line); padding-block: 18px; padding-inline: 12px; background: var(--sunk) }
nav.rail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 76px }
nav.rail button { width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: var(--r); padding: 8px 10px; cursor: pointer;
  display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center }
nav.rail button:hover { background: var(--surface) }
nav.rail button[aria-current="step"] { background: var(--surface); border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent) }
nav.rail .n { font: 700 0.85rem var(--mono); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--muted) }
nav.rail button.done .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
nav.rail .t { font-weight: 600; font-size: 0.9rem; line-height: 1.25 }
nav.rail .t small { display: block; font-weight: 400; color: var(--muted); font-size: 0.76rem }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line) }
.dot.ok { background: var(--ok) } .dot.warn { background: var(--warn) } .dot.bad { background: var(--bad) } .dot.run { background: var(--accent); animation: pulse 1s infinite }
@keyframes pulse { 50% { opacity: 0.3 } }
@media (prefers-reduced-motion: reduce) { .dot.run { animation: none } * { scroll-behavior: auto !important } }

main { padding-block: 22px 60px; padding-inline: 28px; min-width: 0; display: flex; flex-direction: column; gap: 20px }
.stephead { display: flex; flex-direction: column; gap: 8px }
.stephead .lede { color: var(--muted) }
.stepnav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.panel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap }
.panel .cap { color: var(--muted); font-size: 0.85rem }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px }
.controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem }
.field label { color: var(--muted); font-weight: 600 }
.field input, .field select { border: 1px solid var(--line); background: var(--sunk); border-radius: 5px; padding: 6px 8px; width: 8.5rem }
.field input[type=checkbox] { width: auto }
.check { display: flex; gap: 6px; align-items: center; font-size: 0.88rem }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.stat { border-left: 3px solid var(--accent); padding: 4px 10px }
.stat b { display: block; font: 700 1.3rem var(--mono); font-variant-numeric: tabular-nums }
.stat span { color: var(--muted); font-size: 0.8rem }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r) }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
th { font-weight: 600; color: var(--muted); background: var(--sunk); position: sticky; top: 0 }
td.num, th.num { text-align: right }
tr:last-child td { border-bottom: 0 }
.pill { display: inline-block; font: 600 0.72rem/1 var(--body); padding: 4px 7px; border-radius: 99px; letter-spacing: 0.03em; white-space: nowrap }
.pill.match { background: var(--ok-bg); color: var(--ok) } .pill.within { background: var(--warn-bg); color: var(--warn) } .pill.differs { background: var(--bad-bg); color: var(--bad) } .pill.skipped { background: var(--sunk); color: var(--muted) }
.note { border-left: 3px solid var(--joint); background: var(--sunk); padding: 10px 12px; border-radius: 0 var(--r) var(--r) 0; font-size: 0.9rem; max-width: 80ch }
.note.find { border-left-color: var(--bad) }
.progress { font: 0.85rem var(--mono); color: var(--muted) }
.chart { width: 100%; overflow-x: auto }
.chart svg { display: block; width: 100%; height: auto; min-width: 440px }
.chart text { fill: var(--muted); font: 11px var(--body) }
.chart .ttl { fill: var(--ink); font-weight: 600 }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted) }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px }
.help-btn { border: 1px solid var(--line); background: var(--sunk); color: var(--muted); border-radius: 50%; width: 22px; height: 22px; font: 700 0.75rem var(--mono); cursor: pointer; padding: 0 }
.help-btn:hover { color: var(--accent); border-color: var(--accent) }
.pop { position: fixed; z-index: 60; max-width: min(360px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); padding: 10px 12px; border-radius: var(--r); font-size: 0.85rem; box-shadow: 0 6px 24px rgba(0,0,0,.25) }
.drawer { position: fixed; inset: 0; z-index: 50; background: rgba(10, 18, 22, 0.45); display: flex; justify-content: flex-end }
.drawer > div { background: var(--surface); width: min(720px, 100%); height: 100%; overflow-y: auto; padding-block: 20px 40px; padding-inline: 24px; display: flex; flex-direction: column; gap: 14px; padding-top: calc(20px + env(safe-area-inset-top, 0px)) }
.drawer h3 { margin-top: 10px }
.drawer p, .drawer li { font-size: 0.93rem }
.tour { position: fixed; z-index: 70; background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 14px; width: min(340px, calc(100vw - 32px)); box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 10px }
.tour-ring { position: fixed; z-index: 65; border: 3px solid var(--accent); border-radius: 8px; pointer-events: none; box-shadow: 0 0 0 4000px rgba(10, 18, 22, 0.35) }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r); z-index: 80; font-size: 0.88rem }

/* Regenerated thesis chapter, set in the Lamar format (Times-metric face, double spacing, captions per Chicago author-date practice). */
.paper { background: #fff; color: #111; font: 12pt/2 var(--paper); padding-block: 1in; padding-inline: clamp(16px, 8vw, 1in); border: 1px solid var(--line); max-width: 8.5in; margin-inline: auto; overflow-x: auto }
.paper h4 { font: 700 12pt var(--paper); text-align: center; margin: 0 }
.paper h5 { font: 700 12pt var(--paper); margin: 1em 0 0 }
.paper p { text-indent: 0.5in; max-width: none; margin: 0 }
.paper table { font: 11pt/1.3 var(--paper); border-top: 1.5px solid #111; border-bottom: 1.5px solid #111; margin-block: 6px 0 }
.paper th { background: none; color: #111; border-bottom: 1px solid #111; position: static }
.paper td { border: 0 }
.paper .tcap { text-indent: 0; margin-top: 1em } .paper .fcap { text-indent: 0; margin-bottom: 1em }
.paper .chart text { fill: #333 } .paper .chart .ttl { fill: #111 }
.paper .gen { text-indent: 0; font-size: 10pt; line-height: 1.4; border: 1px solid #999; padding: 6px 8px; margin-bottom: 1em }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr) }
  nav.rail { border-right: 0; border-bottom: 1px solid var(--line); padding-block: 8px; overflow-x: auto }
  nav.rail ol { flex-direction: row; position: static; width: max-content }
  nav.rail button { grid-template-columns: 26px auto; padding: 6px 8px } nav.rail .t small, nav.rail .dot { display: none }
  main { padding-inline: 16px }
  .hide-sm { display: none }
}

.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--surface); padding-inline: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 58px)); z-index: 15 }
.tabs button { border: 0; background: transparent; padding: 10px 12px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.tabs .err { color: var(--bad); font-family: var(--mono); font-size: 0.75rem; margin-left: 4px }
main.lab { padding-block: 20px 60px; padding-inline: 24px; max-width: 1400px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px }
.card { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: left; font: inherit; color: inherit }
.card:hover { border-color: var(--accent) } .card.on { box-shadow: inset 0 0 0 2px var(--accent) }
.card .grp { font: 600 0.7rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted) }
.card p { font-size: 0.86rem; color: var(--muted) } .card .exp { color: var(--ink); font-size: 0.82rem; border-top: 1px dashed var(--line); padding-top: 6px }
.editor { display: grid; grid-template-columns: 210px minmax(0, 1fr) 300px; gap: 14px; align-items: start }
.tlist { display: flex; flex-direction: column; gap: 4px }
.tlist button { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent; padding: 7px 10px; border-radius: var(--r); cursor: pointer; text-align: left }
.tlist button[aria-current="true"] { background: var(--surface); border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent) }
.tlist small { font-family: var(--mono); color: var(--muted) }
.sheet { position: relative; display: grid; grid-template-columns: auto 1fr; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; height: 420px }
.gutter { font: 12.5px/1.6 var(--mono); color: var(--muted); text-align: right; padding: 8px 8px; background: var(--sunk); border-right: 1px solid var(--line); user-select: none; overflow: hidden; white-space: pre }
.gutter .e { color: var(--bad); font-weight: 700 }
textarea.code { font: 12.5px/1.6 var(--mono); border: 0; resize: none; padding: 8px 10px; background: transparent; color: var(--ink); white-space: pre; overflow: auto; outline: none; tab-size: 4; height: 100% }
.errs { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem }
.errs button { text-align: left; border: 1px solid var(--bad-bg); background: var(--bad-bg); color: var(--bad); border-radius: 5px; padding: 5px 8px; cursor: pointer }
.ref dt { font: 600 0.82rem var(--mono) } .ref dd { margin: 0 0 6px; font-size: 0.82rem; color: var(--muted) }
.anim { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px }
canvas { width: 100%; display: block; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk) }
.runbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.runbar input[type=range] { width: 160px }
.inspect { font-size: 0.86rem; display: flex; flex-direction: column; gap: 6px }
.inspect dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0 } .inspect dt { color: var(--muted) } .inspect dd { margin: 0; font-family: var(--mono) }
.vcat { display: flex; flex-wrap: wrap; gap: 8px }
@media (max-width: 1100px) { .editor { grid-template-columns: 170px minmax(0, 1fr) } .editor .side { grid-column: 1 / -1 } }
@media (max-width: 760px) { .editor, .anim { grid-template-columns: minmax(0, 1fr) } .tlist { flex-direction: row; flex-wrap: wrap } main.lab { padding-inline: 16px } .sheet { height: 340px } }
</style>
<header class="top" id="hdr">
  <div class="brand"><span class="eyebrow">AI-generated extension of a Lamar University M.S.I.E. thesis</span><h1>Forecast-to-Cost Lab</h1></div>
  <div class="tools">
    <span class="mono" id="modelName" style="color:var(--muted);font-size:.85rem"></span>
    <button class="btn primary" id="runBtn" title="Compile and run the model (R)">Run model</button>
    <button class="btn ghost" id="tourBtn" title="Guided tour (T)">Tour</button>
    <button class="btn ghost" id="helpBtn" title="Help (?)">Help</button>
    <button class="btn ghost" id="themeBtn">Theme</button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main class="lab" id="main"></main>
<div id="layer"></div>
<script id="engine-src">/*ENGINE*/</script>
<script id="extdata-src">/*EXTDATA*/</script>
<script id="lab-src">/*LAB*/</script>
<script id="examples-src">/*EXAMPLES*/</script>
<script id="suite-src">/*SUITE*/</script>
<script>/*APP*/</script>
